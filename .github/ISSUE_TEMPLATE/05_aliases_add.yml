name: '🔗 aliases/add'
description: Link the ID a TV guide (EPG) uses for a channel to the channel here
title: 'Alias: '
labels: ['aliases:add']

body:
  - type: markdown
    attributes:
      value: |
        Each TV guide has its own channel IDs (e.g. iptv-epg names France 3 Alsace `France3-Alsace.fr`).
        An alias lets an application that only knows the guide ID find the logo.

  - type: input
    id: epg_id
    attributes:
      label: EPG ID
      description: ID of the channel in the guide (`<channel id="…">` in the XMLTV file)
      placeholder: 'France3-Alsace.fr'
    validations:
      required: true

  - type: input
    id: epg_source
    attributes:
      label: EPG source
      description: Short name of the guide
      placeholder: 'iptv-epg-fr'
    validations:
      required: true

  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      description: our channel ID (`ch_` and 10 characters), shown on the channel's page of the [website](https://worldwide-tv-logos.github.io/database/countries); its buttons open this form with it filled in
      placeholder: 'ch_1r840gxdj5'
    validations:
      required: true

