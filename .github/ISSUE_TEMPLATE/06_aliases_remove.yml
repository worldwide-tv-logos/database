name: '🔗 aliases/remove'
description: Remove a wrong link between a TV guide ID and an iptv-org ID
title: 'Remove alias: '
labels: ['aliases:remove']

body:
  - type: input
    id: epg_id
    attributes:
      label: EPG ID
      placeholder: 'France3-Alsace.fr'
    validations:
      required: true

  - type: input
    id: epg_source
    attributes:
      label: EPG source
      placeholder: 'iptv-epg-fr'
    validations:
      required: true

  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      description: our channel ID (`ch_...`, shown on the [website](https://worldwide-tv-logos.github.io/database/)), its slug (`france-3-alsace.fr`) or its iptv-org ID (`France3.fr@Alsace`)
      placeholder: 'ch_1r840gxdj5'
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
