name: '🔗 aliases/remove'
description: Remove a wrong link between a TV guide ID and a channel
title: 'Remove alias: '
labels: ['aliases:remove']

body:
  - type: input
    id: epg_id
    attributes:
      label: EPG ID
      placeholder: 'France3-Alsace.fr'
    validations:
      required: true

  - type: input
    id: epg_source
    attributes:
      label: EPG source
      placeholder: 'iptv-epg-fr'
    validations:
      required: true

  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      description: our channel ID (`ch_` and 10 characters), shown on the channel's page of the [website](https://worldwide-tv-logos.github.io/database/countries); its buttons open this form with it filled in
      placeholder: 'ch_1r840gxdj5'
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
