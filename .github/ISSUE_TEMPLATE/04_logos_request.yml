name: '🙋 logos/request'
description: Ask for the logo of a channel when you do not have the image
title: 'Logo wanted: '
labels: ['logos:request']

body:
  - type: markdown
    attributes:
      value: |
        Anyone who finds a suitable image can then submit it with the **logos/add** form, mentioning this issue.
        Channels without a logo are also listed by country in [missing/](../tree/main/missing).

  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      description: our channel ID (`ch_` and 10 characters), shown on the channel's page of the [website](https://worldwide-tv-logos.github.io/database/countries); its buttons open this form with it filled in
      placeholder: 'ch_1r840gxdj5'
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Where the logo can be seen (official website, social networks)
