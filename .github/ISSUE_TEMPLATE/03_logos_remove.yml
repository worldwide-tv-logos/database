name: '❌ logos/remove'
description: Remove a logo that is wrong or no longer used
title: 'Remove logo: '
labels: ['logos:remove']

body:
  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      description: our channel ID (`ch_` and 10 characters), shown on the channel's page of the [website](https://worldwide-tv-logos.github.io/database/countries); its buttons open this form with it filled in
      placeholder: 'ch_1r840gxdj5'
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why the logo should be removed (wrong channel, outdated, broken)
    validations:
      required: true
