name: '❌ logos/remove'
description: Remove a logo that is wrong or no longer used
title: 'Remove logo: '
labels: ['logos:remove']

body:
  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      description: our channel ID (`ch_...`, shown on the [website](https://worldwide-tv-logos.github.io/database/)), its slug (`france-3-alsace.fr`) or its iptv-org ID (`France3.fr@Alsace`)
      placeholder: 'ch_1r840gxdj5'
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why the logo should be removed (wrong channel, outdated, broken)
    validations:
      required: true
