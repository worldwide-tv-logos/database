name: '❌ logos/remove'
description: Remove a logo that is wrong or no longer used
title: 'Remove logo: '
labels: ['logos:remove']

body:
  - type: input
    id: channel_id
    attributes:
      label: Channel ID
      placeholder: 'France3.fr'
    validations:
      required: true

  - type: input
    id: feed_id
    attributes:
      label: Feed ID (optional)
      placeholder: 'Alsace'

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why the logo should be removed (wrong channel, outdated, broken)
    validations:
      required: true
