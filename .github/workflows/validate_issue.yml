name: validate_issue
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: |
      contains(join(github.event.issue.labels.*.name, ','), 'logos:') ||
      contains(join(github.event.issue.labels.*.name, ','), 'aliases:')
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      AUTO_MERGE: ${{ vars.AUTO_MERGE }}
      N: ${{ github.event.issue.number }}
    steps:
      - name: edited after approval -> approval withdrawn (the new content has not been reviewed)
        if: github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'approved')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --remove-label approved
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "This request was edited after its approval: it needs to be approved again."
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: issue-validate
        id: validator
        env:
          RAW_BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: uv run logos issue-validate --number ${{ github.event.issue.number }} --labels "$LABELS"
      - name: valid request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --add-label check:passed --remove-label check:failed
          if [ -s temp/waiting.md ]; then
            gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --add-label waiting:iptv-org
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body-file temp/waiting.md
          fi
      - name: invalid request
        if: failure() && steps.validator.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "This request cannot be applied yet:"; echo; cat temp/errors.md; echo; echo "Edit the issue to fix it: it is checked again automatically."; } > temp/comment.md
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body-file temp/comment.md
          gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --add-label check:failed --remove-label check:passed
      - name: review by Claude (approves or refuses)
        if: success() && env.HAS_CLAUDE == 'true' && !contains(github.event.issue.labels.*.name, 'logos:request')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repository ${{ github.repository }}, issue #${{ github.event.issue.number }}: a request that passed the
            automatic checks. Review it following CLAUDE.md ("Reviewing a logo" or "Reviewing other requests").
            Read the request with `gh issue view ${{ github.event.issue.number }}`. For a logo, the preview is
            temp/preview/sheet-01.png (proposed logo, and the current one for an edit), on dark and light tiles.
            You decide yourself: the best proof is `uv run logos seen-on <channel website page> <logo URL>`
            (FOUND: the logo is on the channel's site; it works where WebFetch is refused), else the web and
            `uv run logos find <logo id>` when unsure.
            Finish with exactly one of:
            - approve: `gh issue edit ${{ github.event.issue.number }} --add-label approved` and a comment with your
              review;
            - refuse (wrong, outdated, not clean, or unverifiable after checking):
              `gh issue close ${{ github.event.issue.number }} --reason "not planned" --comment "<review>"`, the
              review saying why and how to submit a better request (a new issue with a source).
            Only when the request cannot be judged because something is broken (a missing preview, a failing
            tool): `gh issue edit ${{ github.event.issue.number }} --add-label needs:maintainer` and a comment.
          claude_args: |
            --permission-mode default
            --max-turns 30
            --allowedTools "Read,WebFetch,WebSearch,Bash(uv run logos seen-on:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(uv run logos find:*)"
      - name: a logo wanted -> Claude looks for it
        if: success() && env.HAS_CLAUDE == 'true' && contains(github.event.issue.labels.*.name, 'logos:request')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repository ${{ github.repository }}, issue #${{ github.event.issue.number }}: someone asks for the logo of
            a channel (read it with `gh issue view ${{ github.event.issue.number }}`). Follow CLAUDE.md ("Reviewing a
            logo" and "Autonomous work"): run `uv run logos find <logo id>`, look at the contact sheet it writes, and
            if one candidate is clearly the current logo of this exact channel, apply it with
            `uv run logos set <logo id> <url>`. Finish with exactly one `uv run logos verdict ready "<report>"`
            (what you chose and why, or why nothing is good enough: then nothing is published and the request stays
            open for a contributor), and comment the issue with the same report. `hold` only if a tool is broken.
          claude_args: |
            --permission-mode default
            --max-turns 40
            --allowedTools "Read,WebFetch,WebSearch,Bash(uv run logos seen-on:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(uv run logos find:*),Bash(uv run logos set:*),Bash(uv run logos verdict:*)"
      - name: pull request with the logo found (merged when Claude says ready unless AUTO_MERGE is false)
        if: success() && env.HAS_CLAUDE == 'true' && contains(github.event.issue.labels.*.name, 'logos:request')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Logo found by Claude for the request #%s.\n\nCloses #%s\n' "$N" "$N" > temp/request.md
          bash .github/scripts/publish.sh "request/$N" "Logo for request #$N" temp/request.md
