name: claude
# A maintainer writes @claude in an issue or a pull request (question, fix, review): Claude answers there and, when
# asked to change something, works on a branch and opens a pull request. Nobody else can call it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE == 'true'
      - uses: astral-sh/setup-uv@v6
        if: env.HAS_CLAUDE == 'true'
      - run: uv sync
        if: env.HAS_CLAUDE == 'true'
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(uv run logos:*),Bash(uv run pytest:*),Bash(uv run ruff:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
