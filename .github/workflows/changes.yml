name: changes
# Every Monday: the "iptv-org changes" issue lists what needs a look after changes at iptv-org (renames and closures
# are applied every night by `update`): logos of channels renamed in the week (a new branding?), channels no longer
# in iptv-org, and the requests open at iptv-org for the followed countries (information). Claude checks them in a
# pull request, merged when it says ready and the repository variable AUTO_MERGE is not false.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  changes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AUTO_MERGE: ${{ vars.AUTO_MERGE }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: open, update or close the "iptv-org changes" issue
        id: issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run logos changes
          mkdir -p temp
          uv run logos changes --dry-run > temp/changes.md
          if grep -q '^- \[ \]' temp/changes.md; then echo "todo=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Claude applies the changes
        if: env.HAS_CLAUDE == 'true' && steps.issue.outputs.todo == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            temp/changes.md lists the logos of ${{ github.repository }} to check after changes at iptv-org (or says
            there is none: then stop). Renames and closures are already applied to our registry every night (a
            renamed channel keeps its ID and its logo). Follow CLAUDE.md ("Autonomous work") and handle each line:
            - renamed at iptv-org, check the logo: `uv run logos find <id>` and the channel website; a new branding
              is applied with `uv run logos set <id> <url>`; the logo still current: nothing to do;
            - no longer in iptv-org and not replaced: the channel may still exist (check its website); a channel
              gone for good gets its logo removed (`uv run logos remove <id>`), otherwise nothing to do;
            - closed: keep the logo, nothing to do.
            You decide yourself; a logo you cannot confirm is left as it is, and said so in the report.
            Finish with exactly one `uv run logos verdict ready "<report>"` listing what you did and why (`hold`
            only if a tool is broken).
          claude_args: |
            --permission-mode default
            --max-turns 60
            --allowedTools "Read,WebFetch,WebSearch,Bash(uv run logos seen-on:*),Bash(uv run logos move:*),Bash(uv run logos channel-map:*),Bash(uv run logos channel-edit:*),Bash(uv run logos channel:*),Bash(uv run logos remove:*),Bash(uv run logos find:*),Bash(uv run logos set:*),Bash(uv run logos verdict:*)"
      - name: pull request (merged when Claude says ready unless AUTO_MERGE is false)
        if: env.HAS_CLAUDE == 'true' && steps.issue.outputs.todo == 'yes'
        run: |
          printf 'Changes on the iptv-org side, applied by Claude (see the issue labelled iptv-org:changes).\n' > temp/changes-pr.md
          bash .github/scripts/publish.sh "iptv-org-changes" "Apply iptv-org changes" temp/changes-pr.md
