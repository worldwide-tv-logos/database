name: harvest
# Sunday: harvest (new logos and better versions of current ones, from tv-logos, iptv-org and Wikidata).
# Wednesday: hunt (a slice of the channels still without a logo, every source including their website).
# One pull request per followed country (data/countries.csv), reviewed by Claude, merged automatically when Claude
# says it is ready and the repository variable AUTO_MERGE is true.
on:
  workflow_dispatch:
    inputs:
      country:
        description: 'only this country (two-letter code, e.g. es); empty: every country of data/countries.csv'
        required: false
      mode:
        description: 'harvest or hunt'
        required: false
        default: harvest
  schedule:
    - cron: '0 4 * * 0'
    - cron: '0 4 * * 3'
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: harvest
jobs:
  countries:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      mode: ${{ steps.list.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: followed countries without a pull request of this mode under review
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.country }}
          MODE: ${{ github.event.schedule == '0 4 * * 3' && 'hunt' || inputs.mode || 'harvest' }}
        run: |
          out=()
          for cc in $(tail -n +2 data/countries.csv | cut -d, -f1); do
            if [ -n "$ONLY" ] && [ "$cc" != "$ONLY" ]; then continue; fi
            if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$MODE/$cc" --state open --json number --jq '.[0].number')" ]; then
              echo "$cc: the previous $MODE is still under review"; continue
            fi
            out+=("\"$cc\"")
          done
          echo "list=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  country:
    needs: countries
    if: needs.countries.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1                      # one download at a time
      fail-fast: false
      matrix:
        cc: ${{ fromJSON(needs.countries.outputs.list) }}
    env:
      CC: ${{ matrix.cc }}
      MODE: ${{ needs.countries.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
      AUTO_MERGE: ${{ vars.AUTO_MERGE }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: collect and import
        id: collect
        run: |
          if [ "$MODE" = hunt ]; then uv run logos hunt --country "$CC"; else uv run logos harvest --country "$CC" --updates; fi
          if [ "$(wc -l < "temp/harvest/$CC/manifest.csv")" -le 1 ]; then echo "nothing found"; exit 0; fi
          uv run logos import "temp/harvest/$CC/manifest.csv"
          git worktree add -q ../base origin/main
          echo "found=yes" >> "$GITHUB_OUTPUT"
      - name: review by Claude
        if: steps.collect.outputs.found == 'yes' && env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You review the weekly ${{ needs.countries.outputs.mode }} of the country `${{ matrix.cc }}` of
            ${{ github.repository }}, following CLAUDE.md ("Reviewing a logo" and "Autonomous work").
            The logos found are already imported in the working tree. The list is
            temp/harvest/${{ matrix.cc }}/summary.md; look at EVERY logo on the contact sheets
            temp/harvest/${{ matrix.cc }}/sheet-*.png (numbered; each logo on a dark and a light tile).
            - A wrong logo: `uv run logos reject <channel id> --base ../base --reason "<short reason>"`.
            - When you rejected one, or are unsure that a logo is current, `uv run logos find <channel id>` lists
              every candidate from every source with a contact sheet (temp/find/<id>/sheet-01.png); apply a better
              one with `uv run logos set <channel id> <url>`, or leave the channel without a logo.
            Finish with exactly one `uv run logos verdict ready|hold "<report>"`: `ready` only if every remaining
            logo is right; the report lists what you rejected, replaced and why, and anything a maintainer
            should check.
          claude_args: |
            --permission-mode default
            --max-turns 150
            --allowedTools Read,WebFetch,WebSearch,Bash(uv run logos reject:*),Bash(uv run logos find:*),Bash(uv run logos set:*),Bash(uv run logos verdict:*),Bash(uv run logos sheet:*)
      - name: pull request (merged when Claude says ready and AUTO_MERGE is true)
        if: steps.collect.outputs.found == 'yes'
        run: |
          name=$(grep "^$CC," data/countries.csv | cut -d, -f2)
          title="$([ "$MODE" = hunt ] && echo "Weekly hunt" || echo "Weekly harvest"): $name"
          bash .github/scripts/publish.sh "$MODE/$CC" "$title" "temp/harvest/$CC/summary.md"
