name: harvest
# Sunday: harvest (new logos and better versions of current ones, from every source of worldwide_tv_logos/sources:
# Wikidata, Wikipedia, Commons, iptv-org, iptv-epg, picons, xmltv-se; a weekly slice of 700 channels at most).
# Wednesday: hunt (a slice of the channels still without a logo and of the small logos, every source including their
# website).
# On demand, mode `new`: the channels added in the last two days and still without a logo, every source including
# their website (started by `update` as soon as channels are added).
# One pull request per followed country (data/countries.csv), reviewed by Claude, merged automatically when Claude
# says it is ready and the repository variable AUTO_MERGE is not false.
on:
  workflow_dispatch:
    inputs:
      country:
        description: 'only these countries (two-letter codes, e.g. es or "it pt"); empty: every country of data/countries.csv'
        required: false
      mode:
        description: 'harvest, hunt, or new (channels added in the last two days, without a logo)'
        required: false
        default: harvest
  schedule:
    - cron: '0 4 * * 0'
    - cron: '0 4 * * 3'
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: harvest-${{ inputs.mode == 'new' && 'new' || 'weekly' }}    # new channels never wait for the weekly run
jobs:
  countries:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      mode: ${{ steps.list.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: followed countries without a pull request of this mode waiting (one on hold is redone)
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.country }}
          MODE: ${{ github.event.schedule == '0 4 * * 3' && 'hunt' || inputs.mode || 'harvest' }}
        run: |
          out=()
          for cc in $(tail -n +2 data/countries.csv | cut -d, -f1); do
            if [ -n "$ONLY" ] && [[ " ${ONLY//,/ } " != *" $cc "* ]]; then continue; fi
            if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$MODE/$cc" --state open --json number,labels \
                  --jq '.[] | select(all(.labels[]; .name != "needs:maintainer")) | .number')" ]; then
              echo "$cc: the previous $MODE waits to be merged"; continue
            fi
            out+=("\"$cc\"")
          done
          echo "list=[$(IFS=,; echo "${out[*]}")]" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  country:
    needs: countries
    if: needs.countries.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1                      # one download at a time
      fail-fast: false
      matrix:
        cc: ${{ fromJSON(needs.countries.outputs.list) }}
    env:
      CC: ${{ matrix.cc }}
      MODE: ${{ needs.countries.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
      AUTO_MERGE: ${{ vars.AUTO_MERGE }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra browser
      - name: headless browser for the channel websites (web.py)
        run: uv run playwright install --with-deps chromium
      - name: answers of the sources kept between runs (Wikidata, Wikipedia and Commons, thirty days)
        uses: actions/cache@v6
        with:
          path: .cache
          key: sources-${{ matrix.cc }}-${{ github.run_id }}
          restore-keys: sources-${{ matrix.cc }}-
      - name: collect and import
        id: collect
        run: |
          case "$MODE" in
            hunt) uv run logos hunt --country "$CC" ;;
            new) uv run logos hunt --country "$CC" --recent 2 ;;
            *) uv run logos harvest --country "$CC" --updates ;;
          esac
          if [ "$(wc -l < "temp/harvest/$CC/manifest.csv")" -gt 1 ]; then
            uv run logos import "temp/harvest/$CC/manifest.csv"
          fi
          uv run logos guide-aliases --country "$CC"         # after the import: an alias needs a logo
          if [ "$(wc -l < "temp/harvest/$CC/manifest.csv")" -le 1 ]              && ! grep -qE '^### (Current logos to check|New guide aliases)' "temp/harvest/$CC/summary.md"; then
            echo "nothing found"; exit 0
          fi
          git worktree add -q ../base origin/main
          echo "found=yes" >> "$GITHUB_OUTPUT"
      - name: review by Claude
        id: review
        if: steps.collect.outputs.found == 'yes' && env.HAS_CLAUDE == 'true'
        # Claude unavailable (usage limit...): the pull request is still opened, on hold, and redone at the next run
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You review the weekly ${{ needs.countries.outputs.mode }} of the country `${{ matrix.cc }}` of
            ${{ github.repository }}, following CLAUDE.md ("Reviewing a logo" and "Autonomous work").
            The logos found are already imported in the working tree. The list is
            temp/harvest/${{ matrix.cc }}/summary.md; look at EVERY logo on the contact sheets
            temp/harvest/${{ matrix.cc }}/sheet-*.png (numbered; each logo on a dark and a light tile).
            You decide every logo yourself, nobody reviews after you. The Source column of the summary says where
            each logo comes from: wikidata and wikipedia (the channel's own record) need no other proof unless they
            look old; every other logo (iptv-org, iptv-epg, picons, xmltv-se, commons, website) needs one. The
            harvest already looked for each of them on the channel's website (Website column):
            - "FOUND on <site>" (site confirmed): the proof; keep the logo if it is this channel's and clean;
            - "not found", "unreadable" or "no website": look at temp/harvest/${{ matrix.cc }}/sites-*.png, each
              logo next to the top of its channel's website as people see it: the same logo there is the proof
              (say so in the report); a different logo there is a reason to reject; else check on the web
              (WebSearch, WebFetch, `uv run logos seen-on <page> <logo>`); what stays unconfirmed is set aside with
              `uv run logos reject <channel id> --base ../base --unconfirmed --reason "no proof"` (proposed again
              next time), never rejected for good.
            Say in the report which proof each kept logo has. An update marked "same drawing" only replaces a logo by a
            sharper file of it: check that it is clean (no background, nothing cut). An update marked "DIFFERENT
            drawing" is kept only if you confirmed on the web that it is the current branding of the channel.
            - unsure that a logo is right and current: check it (channel website, web search, and
              `uv run logos find <channel id>`, which lists every candidate with a contact sheet
              temp/find/<id>/sheet-01.png); apply a clearly better one with `uv run logos set <channel id> <url>`;
            - wrong (another channel, a group logo, an old branding, not clean): `uv run logos reject <channel id>
              --base ../base --reason "<short reason>"` (never proposed again);
            - right perhaps but still unverifiable after checking: the same with `--unconfirmed` (removed from this
              pull request, proposed again at the next harvest). A new logo leaves the channel missing; an update
              keeps the current logo.
            The summary may list "Current logos to check": logos already published with the drawing of a channel
            of another family. Compare them (`uv run logos sheet --channels <a>,<b>`, the channels' websites) and
            remove the wrong one with `uv run logos remove <logo id>`; keep both only if both are right.
            It may list "Different from the brand's logo in other countries": a logo found that differs from the
            logo of the same brand already published for other countries (Nick Jr, Disney Channel...). It is often
            an older branding: compare them; when the brand's logo is the current one for this channel too, apply
            it with `uv run logos set <channel id> <its URL>`; keep the logo found only if it is current (a regional
            version, checked on the web).
            It may also list "New guide aliases" (guide IDs matched by name): remove a wrong one with
            `uv run logos alias-remove <source> <guide id>`.
            Finish with exactly one `uv run logos verdict ready "<report>"` (what remains is merged; the report
            lists every rejected or replaced logo and why). Use `hold` only if the change itself is broken.
          claude_args: |
            --permission-mode default
            --max-turns 400
            --allowedTools "Read,WebFetch,WebSearch,Bash(uv run logos seen-on:*),Bash(uv run logos reject:*),Bash(uv run logos find:*),Bash(uv run logos set:*),Bash(uv run logos remove:*),Bash(uv run logos alias-remove:*),Bash(uv run logos verdict:*),Bash(uv run logos sheet:*)"
      - name: why Claude stopped
        if: steps.review.outcome == 'failure'
        run: |
          jq -r '.[] | select(.type == "result") | .result // .subtype' "$RUNNER_TEMP/claude-execution-output.json" || true
          echo "Claude did not finish: the pull request stays on hold and is redone at the next run." >> temp/harvest/$CC/summary.md
          rm -f temp/verdict.json
      - name: pull request (merged when Claude says ready unless AUTO_MERGE is false)
        if: steps.collect.outputs.found == 'yes'
        run: |
          name=$(grep "^$CC," data/countries.csv | cut -d, -f2)
          case "$MODE" in hunt) kind="Weekly hunt" ;; new) kind="New channels" ;; *) kind="Weekly harvest" ;; esac
          title="$kind: $name"
          bash .github/scripts/publish.sh "$MODE/$CC" "$title" "temp/harvest/$CC/summary.md"
