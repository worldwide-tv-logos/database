name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: workflow files are valid YAML (GitHub silently skips an invalid one)
        run: uv run --with pyyaml python -c "import sys, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in sys.argv[1:]]" .github/workflows/*.yml
      - run: uv run ruff check worldwide_tv_logos tests
      - run: uv run pytest -q
      - run: uv run logos validate
      - name: no older version of a logo comes back (HEAD is the pull request merged into main, HEAD^1 is main)
        if: github.event_name == 'pull_request'
        run: uv run logos regress-check HEAD^1
