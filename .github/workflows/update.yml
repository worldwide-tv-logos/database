name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: write
  issues: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: apply approved issues (each one alone; a faulty one is reported and skipped)
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run logos update
          echo "processed=$(cat temp/processed.txt)" >> "$GITHUB_OUTPUT"
      - run: uv run logos validate
      - run: uv run logos export
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logos sources missing
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "[bot] update data" -m "${{ steps.update.outputs.processed }}"
          git push
      - name: keep the scheduled workflows active (GitHub disables them after 60 days without activity)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi
      - name: notify the processed issues
        if: steps.update.outputs.processed != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run logos notify --commit "$(git rev-parse --short HEAD)"
