name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: write
  issues: write
  actions: write                   # starts the hunt of the logos of the channels just added
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: apply approved issues (each one alone; a faulty one is reported and skipped)
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run logos update
          echo "processed=$(cat temp/processed.txt)" >> "$GITHUB_OUTPUT"
      - name: iptv-org changes applied to our registry (renames keep their channel, closures, names)
        run: uv run logos watch-iptvorg
      - name: register the new channels of the followed countries in our registry (data/channels.csv; adds only)
        run: uv run logos channels-init
      - run: uv run logos validate
      - run: uv run logos export
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logos sources missing
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "[bot] update data" -m "${{ steps.update.outputs.processed }}" -m "$(cat temp/watch.md 2>/dev/null)"
          git push
      - name: keep the scheduled workflows active (GitHub disables them after 60 days without activity)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi
      - name: channels added today without a logo -> their logos looked for right away (harvest, mode new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          countries=$(uv run python -c "
          import datetime
          from worldwide_tv_logos.db import Database
          db = Database().load()
          have = {x.channel for x in db.logos.values()}
          today = datetime.date.today().isoformat()
          print(' '.join(sorted({c.country for c in db.channels.values()
                                 if c.added >= today and c.status == 'active' and c.id not in have}
                                & set(db.countries))))")
          if [ -n "$countries" ]; then
            echo "new channels without a logo in: $countries"
            gh workflow run harvest.yml -R "$GITHUB_REPOSITORY" -f mode=new -f country="$countries"
          fi
      - name: notify the processed issues
        if: steps.update.outputs.processed != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run logos notify --commit "$(git rev-parse --short HEAD)"
