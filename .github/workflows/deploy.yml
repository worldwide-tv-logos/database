name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [update, harvest, validate_issue, changes, harvest_reject]
    types: [completed]
permissions:
  contents: write
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run logos export
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./.api
          publish_branch: gh-pages
          commit_message: '[bot] deploy'
