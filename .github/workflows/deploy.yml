name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [update, harvest, validate_issue, changes, harvest_reject]
    types: [completed]
permissions:
  contents: write
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: uv run logos export
      # the website (site/, Nuxt): static pages, then the data and logos of .api/ next to them
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm install --no-audit --no-fund   # not `npm ci`: the lock file made on Windows lacks Linux-only optional packages
        working-directory: site
      - run: npx nuxt generate
        working-directory: site
        env:
          NUXT_APP_BASE_URL: /database/
      - run: cp -r .api/. site/.output/public/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./site/.output/public
          publish_branch: gh-pages
          commit_message: '[bot] deploy'
