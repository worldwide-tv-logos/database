[project]
name = "worldwide-tv-logos"
version = "0.1.0"
description = "Clean TV channel logos keyed by iptv-org channel id"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyoxipng>=9.1.1",
    "resvg-py>=0.5.0",
    "scikit-image>=0.25",
    "scipy>=1.15",
]

[project.optional-dependencies]
# reading channel websites in a headless browser (web.py), then `uv run playwright install chromium`
browser = ["playwright>=1.60"]

[project.scripts]
logos = "worldwide_tv_logos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldwide_tv_logos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
